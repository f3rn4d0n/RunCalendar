name: RunCalendar
options:
  bundleIdPrefix: com.fercho.runcalendar
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0" # Modo Swift 5 para convivir sin fricción con Firebase
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM se define en RunCalendar/Resources/Secrets.xcconfig (gitignored)

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: "7.1.0"

targets:
  RunCalendar:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RunCalendar
    configFiles:
      Debug: RunCalendar/Resources/Secrets.xcconfig
      Release: RunCalendar/Resources/Secrets.xcconfig
    info:
      path: RunCalendar/Resources/Info.plist
      properties:
        CFBundleDisplayName: Rumbo
        # La identidad Neon es dark-first: la app se fija en oscuro y no sigue al sistema.
        # Aquí y no con `.preferredColorScheme(.dark)` para que también cubra lo que presenta
        # UIKit (alertas, teclado, hojas de Salud/Calendario), fuera del alcance de SwiftUI.
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - PermanentMarker.ttf
        NSHealthShareUsageDescription: >-
          Rumbo lee tus entrenamientos y datos de condición física de Salud
          para estimar tu preparación hacia tus carreras.
        NSHealthUpdateUsageDescription: >-
          Rumbo guarda en Salud el peso que registras, para que tu progreso
          esté también en la app Salud y en el resto de tus apps.
        NSCalendarsWriteOnlyAccessUsageDescription: >-
          Rumbo agrega tus carreras y entregas de kit a tu calendario.
        LSApplicationQueriesSchemes:
          - comgooglemaps
          - waze
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(REVERSED_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fercho.runcalendar.app
        CODE_SIGN_ENTITLEMENTS: RunCalendar/Resources/RunCalendar.entitlements
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
      configs:
        # Explícito, no por defecto: sin dSYM los crashes de Crashlytics llegan como
        # direcciones de memoria y el panel deja de servir para nada.
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    # Sube los dSYM a Crashlytics al terminar el build. Sin esto los reportes llegan
    # sin simbolizar (direcciones de memoria, no nombres de función).
    # Solo en Release: Debug no genera dSYM y ahí el reporte está apagado de todos modos
    # (ver `Log.configureCrashReporting`), así que correrlo solo dejaría un warning en cada build.
    postBuildScripts:
      - name: Crashlytics · subir dSYM
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          fi
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
          - $(SRCROOT)/$(BUILT_PRODUCTS_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: GoogleSignIn
        product: GoogleSignIn
